[package]
name = "i18n-status-core"
version = "0.7.0"
license = "MIT"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "i18n-status-core"
path = "src/main.rs"

[lib]
name = "i18n_status_core"
path = "src/lib.rs"

[dependencies]
swc_core = { version = "83", features = ["common", "ecma_ast", "ecma_parser", "ecma_visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
rayon = "1"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
