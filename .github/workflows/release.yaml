name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish_core: ${{ steps.contract.outputs.publish_core }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Verify the unified source contract
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/verify-release-contract.sh "$GITHUB_REF_NAME"
          cargo check --locked --manifest-path rust/Cargo.toml

  build:
    needs:
      - verify-contract
    if: needs.verify-contract.outputs.publish_core == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: i18n-status-core-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: i18n-status-core-linux-aarch64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: i18n-status-core-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: i18n-status-core-macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5
      - name: Build (native)
        if: "!matrix.cross"
        working-directory: rust
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.cross
        # With --manifest-path, cross mounts the current repository directory as /project.
        run: cross build --locked --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
      - name: Package binary
        run: |
          package_dir="$(mktemp -d)"
          cp rust/target/${{ matrix.target }}/release/i18n-status-core "$package_dir/${{ matrix.artifact }}"
          cp core-contract.json "$package_dir/core-contract.json"
          chmod +x "$package_dir/${{ matrix.artifact }}"
          tar czf ${{ matrix.artifact }}.tar.gz -C "$package_dir" ${{ matrix.artifact }} core-contract.json
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  verify-artifact:
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download native Linux artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: i18n-status-core-linux-x86_64
          path: dist
      - name: Verify packaged contract handshake
        run: |
          cd dist
          sha256sum --check i18n-status-core-linux-x86_64.tar.gz.sha256
          tar xzf i18n-status-core-linux-x86_64.tar.gz
          cmp ../core-contract.json core-contract.json
          bash ../scripts/smoke-core-contract.sh ./i18n-status-core-linux-x86_64 ./core-contract.json

  release:
    needs:
      - verify-contract
      - build
      - verify-artifact
    if: >-
      always() && needs.verify-contract.result == 'success' &&
      (needs.verify-contract.outputs.publish_core == 'false' ||
      (needs.build.result == 'success' && needs.verify-artifact.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        if: needs.verify-contract.outputs.publish_core == 'true'
        uses: actions/download-artifact@v8.0.2
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_CORE: ${{ needs.verify-contract.outputs.publish_core }}
        run: |
          files=()
          if [[ "$PUBLISH_CORE" == "true" ]]; then
            files=(i18n-status-core-*/*.tar.gz*)
          fi
          # gh publishes only after every asset is uploaded, so a published release is complete and,
          # being immutable, cannot be changed. A rerun only finishes a draft left by an interrupted run.
          if ! is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${files[@]}"
          elif [[ "$is_draft" == "true" ]]; then
            if (( ${#files[@]} > 0 )); then
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            fi
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            echo "::notice::Release ${GITHUB_REF_NAME} is already published"
          fi
